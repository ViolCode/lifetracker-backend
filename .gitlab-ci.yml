stages:
  - build
  - test
  - quality

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: gradle-cache
  paths:
    - .gradle/wrapper
    - .gradle/caches

build-backend:
  stage: build
  script:
    - .\gradlew.bat clean assemble

  artifacts:
    when: always
    paths:
      - build/libs/*.jar
    expire_in: 1 week

unit-tests:
  stage: test
  script:
    - .\gradlew.bat test jacocoTestReport

  artifacts:
    when: always
    reports:
      junit:
        - build/test-results/test/*.xml

    paths:
      - build/reports/tests/test
      - build/reports/jacoco/test/html
      - build/test-results/test

    expire_in: 1 week

code-quality:
  stage: quality
  script:
    - .\gradlew.bat check

  artifacts:
    when: always
    paths:
      - build/reports
    expire_in: 1 week