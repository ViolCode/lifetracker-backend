stages:
  - build
  - test

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: gradle-cache
  paths:
    - .gradle/wrapper
    - .gradle/caches

build:
  stage: build
  script:
    - .\gradlew.bat clean assemble --no-daemon

  artifacts:
    paths:
      - build/libs/*.jar

test:
  stage: test
  script:
    - .\gradlew.bat test jacocoTestReport --no-daemon --info

  artifacts:
    when: always
    reports:
      junit:
        - build/test-results/test/*.xml
    paths:
      - build/reports/tests/test
      - build/reports/jacoco/test/html