image: gradle:9.3.1-jdk21

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: "gradle-cache-$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper
    - .gradle/caches

stages:
  - build
  - test
  - sonarqube
  - deploy

build:
  stage: build
  tags:
    - docker-runner
  script:
    - gradle clean assemble --no-daemon
  artifacts:
    paths:
      - build/libs/*.jar
      - build/classes/java/main

test:
  stage: test
  tags:
    - docker-runner
  script:
    - gradle test jacocoTestReport --no-daemon
  artifacts:
    reports:
      junit:
        - build/test-results/test/*.xml
    paths:
      - build/reports/tests/test
      - build/reports/jacoco/test

sonarqube:
  stage: sonarqube
  tags:
    - docker-runner
  allow_failure: true
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
  script:
    - gradle sonar

deploy:
  stage: deploy
  image: docker:latest
  tags:
    - docker-runner
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - docker build -t "$DOCKER_USERNAME/lifetracker:latest" .
    - docker push "$DOCKER_USERNAME/lifetracker:latest"
    - ssh "$SSH_USER@$SSH_HOST" "
        docker pull $DOCKER_USERNAME/lifetracker:latest &&
        docker stop lifetracker || true &&
        docker rm lifetracker || true &&
        docker run -d --name lifetracker --restart unless-stopped -p 8080:8080 $DOCKER_USERNAME/lifetracker:latest
      "
      