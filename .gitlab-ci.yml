stages:
  - build
  - test
  - sonarqube

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GIT_DEPTH: "0"

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

build:
  stage: build
  tags:
    - docker-runner
  image: gradle:9.3.1-jdk21
  script:
    - gradle clean assemble --no-daemon
  artifacts:
    paths:
      - build/libs/*.jar

test:
  stage: test
  tags:
    - docker-runner
  image: gradle:9.3.1-jdk21
  script:
    - gradle test jacocoTestReport --no-daemon
  artifacts:
    reports:
      junit:
        - build/test-results/test/*.xml
    paths:
      - build/reports/tests/test
      - build/reports/jacoco/test

sonarqube:
  stage: sonarqube
  tags:
    - docker-runner
  image: gradle:9.3.1-jdk21
  dependencies:
    - test
  script:
    - gradle sonarqube --no-daemon
  allow_failure: true
  only:
    - master