image: gradle:9.3.1-jdk21

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: "gradle-cache-$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper
    - .gradle/caches

stages:
  - build
  - test
  - sonarqube
  - deploy

build:
  stage: build
  tags:
    - docker-runner
  script:
    - gradle clean assemble --no-daemon
  artifacts:
    paths:
      - build/libs/*.jar
      - build/classes/java/main

test:
  stage: test
  tags:
    - docker-runner
  script:
    - gradle test jacocoTestReport --no-daemon
  artifacts:
    reports:
      junit:
        - build/test-results/test/*.xml
    paths:
      - build/reports/tests/test
      - build/reports/jacoco/test

sonarqube:
  stage: sonarqube
  tags:
    - docker-runner
  allow_failure: true
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
  script:
    - gradle sonar