image: gradle:9.3.1-jdk21-jammy

stages:
  - build
  - test
  - sonar

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  GIT_DEPTH: "0"

cache:
  policy: pull-push
  paths:
    - .gradle/wrapper
    - .gradle/caches
    - .sonar/cache

build:
  stage: build

  script:
    - chmod +x gradlew
    - ./gradlew clean assemble --no-daemon

  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 week

test:
  stage: test

  script:
    - chmod +x gradlew
    - ./gradlew test jacocoTestReport --no-daemon

  artifacts:
    reports:
      junit:
        - build/test-results/test/*.xml

    paths:
      - build/reports/tests/test
      - build/reports/jacoco/test
      - build/test-results/test

    expire_in: 1 week

sonarqube:
  stage: sonar

  script:
    - chmod +x gradlew
    - ./gradlew sonar --info

  allow_failure: false

  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"